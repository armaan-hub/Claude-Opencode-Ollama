# ~/.config/yazi/keymap.toml
# Extends yazi defaults — adds Ctrl+F for fzf deep search with bat preview
# NOTE: <C-f> normally maps to "arrow 100%" (page down) — intentionally shadowed here
# NOTE: yazi 26 has `plugin fzf` (bound to z) but lacks bat preview; this shell
#       binding adds the --preview panel and fd's --hidden/--follow flags

[manager]

prepend_keymap = [
  { on = "<C-f>", run = "shell 'fd --type f --hidden --follow --exclude .git . | fzf --height 50% --reverse --preview \"bat --color=always {} 2>/dev/null || cat {}\" | xargs -I{} ya emit reveal \"{}\"' --block", desc = "fzf: deep recursive file search" },
]
