# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TMUX CONFIGURATION FOR TERMINAL WORKSPACE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── PREFIX KEY ─────────────────────────────────────────────────────────────
set -g prefix C-b

# ── MOUSE SUPPORT ──────────────────────────────────────────────────────────
set -g mouse on

# ── PANE DISPLAY ───────────────────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-format "#[align=left]#{pane_title}"

# Automatic pane titles based on running command
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# ── WINDOW & PANE NUMBERING ───────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── VISUAL STYLE ───────────────────────────────────────────────────────────
set -g window-status-separator " │ "

# Active window (bold, highlight)
set -g window-status-current-format " #[bold]#{window_index}:#{window_name}#[nobold] "

# Inactive window
set -g window-status-format " #{window_index}:#{window_name} "

# ── PANE BORDERS ───────────────────────────────────────────────────────────
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy

# ── COLORS (Catppuccin Mocha) ──────────────────────────────────────────────
set -g status-bg "#313244"
set -g status-fg "#a6adc8"

# Black pane background (matches Ghostty black background)
set -g window-style 'bg=#000000'
set -g window-active-style 'bg=#000000'

# Status line
set -g status-left " #[bold,fg=#cdd6f4]tmux#[nobold] │ "
set -g status-right " │ %H:%M │ #[fg=#a6adc8]#{host} "
set -g status-left-length 50
set -g status-right-length 50

# ── PANE LAYOUT (Compact Right Column) ─────────────────────────────────────
# Don't set layout automatically - user can arrange manually
# Default: main-vertical (main pane left, vertical splits right)
set -g main-pane-width 75%

# ── NOTIFICATIONS & ALERTS ────────────────────────────────────────────────
# Disable activity notifications (reduce clutter)
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Disable window alerts
set -g monitor-activity off

# ── KEY BINDINGS ───────────────────────────────────────────────────────────
# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes
bind | split-window -h
bind - split-window -v

# New window
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -r n next-window
bind -r p previous-window

# ── COPY MODE ──────────────────────────────────────────────────────────────
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── WINDOW TITLES ──────────────────────────────────────────────────────────
# Rename windows based on running command

# ── SESSION SETTINGS ───────────────────────────────────────────────────────
# Start new sessions with default layout
set -g default-shell /bin/zsh
# tmux-256color + RGB passthrough: required for Nerd Font icons (fixes □ boxes)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -ga terminal-overrides ",*256col*:Tc"

# ── DISPLAY ────────────────────────────────────────────────────────────────
# Show pane information
set -g display-time 1000

# Scrollback history
set -g history-limit 5000
